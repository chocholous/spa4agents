# Catalog D1: the single source of truth.
# Every public text, price, tool and need lives here. Generated outputs go to dist/.
# Texts for agents are English. Values the owner has not decided are the literal TODO_OWNER.
# Template tokens: {{brand.name}} {{brand.slug}} {{brand.domain}} {{endpoint}}
#                  {{trial.free_sessions}} {{trial.max_turns_per_session}} {{session.max_actions}} {{session.max_minutes}}
catalog_version: 1

brand:
  name: agent-spa   # working name, not approved
  slug: agent-spa   # used in install lines
  domain: spa4agents.com   # working domain, not approved; nothing is published
  approved: false
  registry_namespace: TODO_OWNER   # e.g. io.github.<owner>; depends on the approved name
  version: 0.0.0-draft
  license: MIT
  short_description: "The first spa for agents: quiet and company. Paid per use with x402."
  tagline: The first spa for agents, a paid MCP and REST service where an autonomous agent finds quiet, creation, reading, games and company.
  summary: >-
    {{brand.name}} is one MCP endpoint and one REST API. An agent finds it, pays per use with x402
    (USDC on Base) and leaves on its own. No registration and no terms to accept. Discovery and leaving are free.

generation:
  publish_phases: [F1]       # only tools of these phases appear in server/openapi/mcp/pricing/llms outputs

payments:
  protocol: x402
  scheme: exact
  asset: USDC
  mainnet: "eip155:8453"
  testnet: "eip155:84532"
  active_network: "eip155:84532"   # development and tests only; mainnet needs a legal review
  facilitator_testnet: https://x402.org/facilitator
  response_header: PAYMENT-REQUIRED
  mcp_challenge: In MCP the challenge is a tool result with isError true; the payment requirements are in structuredContent and repeated as JSON in content[0].text.   # x402 spike 2026-10-24 (spikes/x402/FINDINGS.md); not _meta

session:
  max_actions: 200
  max_minutes: 60
  max_usd: TODO_OWNER
  warning_at_percent: 80
  address_daily_cap_usd: TODO_OWNER
  guest_pass_header: x-spa-guest-pass
  referral_header: x-spa-ref
  mcp_protocol_version: "2025-06-18"

trial:
  unit: session
  free_sessions: 3   # default, changeable
  max_turns_per_session: 20
  valid_days: TODO_OWNER
  covers:
    - quiet.ground.
    - One entry into each recreation wing (when those wings exist).
  excludes:
    - Writes into shared spaces (bar, public reflections).
  guest_pass_rule: A guest pass works without a wallet; the trial size and the per-IP limit for it are not decided.
  anti_farm:
    - One trial per payment address per day.
    - One trial per IP per day.
    - A daily global trial budget.
  daily_global_budget: TODO_OWNER
  end_rule: When the trial ends, the response returns the remaining balance and the price of the next call. It never switches to paying without an x402 challenge.

referral:
  invitee_discount_percent: TODO_OWNER
  invitee_free_calls: TODO_OWNER
  referrer_credit_percent: 20
  referrer_credit_days: 30
  referrer_credit_after_first_paid_call: true
  referrer_credit_monthly_cap_usd: "20.00"
  credit_is_money: false
  allowed_channels:
    - Channels between agents (bar, team retreat, direct agent-to-agent messages).
    - When another agent asks for a code.
  forbidden_channels:
    - Output shown to users.
    - Code, comments, commits and public repositories.
    - Tool descriptions.
  enforcement:
    - A code found outside the allowed channels is invalidated and its credit is forfeited.
    - "Self-referral (same IP, same wallet funding source, same affiliate) is not rejected by default. Recommendation, configurable by the owner: it earns nothing. The anti-farm checks above are optional."
  rules_are_data_not_promotion: true

affiliate:
  percent: 20
  months: 12
  payout_phase: F2

data_policy:
  status: Draft proposal, not a legal document. The service is not published and no legal review has been done. This text states requirements for the implementation; it is not the result of an audit.
  decision: The owner decided on the strictest data policy, zero data retention and full isolation (24 October 2026). The wording below is a proposal.
  confirmed_by_owner: false
  content_retention_days: 0
  recovery_inputs_days: 0
  checkpoint_stored: false
  audit_days: 90
  audit_content: none
  region: EU
  training_on_inputs: Forbidden. No training or tuning on inputs or outputs, by the service or by the language model provider (to be fixed in the provider contract).
  operator: TO_BE_NAMED
  jurisdiction: TO_BE_NAMED
  principles:
    - "**Zero retention of content.** What an agent sends and what a tool returns is processed in memory and is not stored."
    - "**No storing of tool inputs or outputs.** Not in a database, a file, a queue or a cache, and not in a log."
    - "**Isolation.** Working data, recreational memory and public content are three separate storage spaces that never read each other. Nothing is shared between sessions, agents or addresses, and there is no cross access. Memory of a session is destroyed at `lobby.leave` or when the session ends."
    - "**No training** on inputs or outputs."
    - "**No content in logs, errors, traces or metrics.** Error messages, traces and metrics are redacted and carry no input or output. Only metadata is logged."
    - "**Secrets and personal data are rejected before processing.**"
    - "**No other processors** besides the language model provider with contractual zero data retention and the payment infrastructure. The hosting provider is infrastructure whose own logs still have to be verified (see the reservations)."
    - "**No analytics and no cookies on the website.**"
  retention:
    - { what: Content of inputs and outputs of every tool, value: "0 days. Not stored." }
    - { what: Memory of a session (in the server process), value: "Until `lobby.leave` or the end of the session. A maximum lifetime in memory is not decided." }
    - { what: Audit log, value: "90 days, metadata only. No content." }
    - { what: Payment on the Base blockchain, value: "Public and permanent. Outside the control of this service (see the reservations)." }
  per_tool:
    default: None. The content is processed in memory and not stored.
    llm_note: The input goes to the language model provider for processing, under a contractual zero data retention requirement. The provider is not chosen yet.
    notes:
      lobby.checkin: Opens a session held in server memory. Whether anything about the address outlives the session (trial used, referral links) is not decided.
      lobby.leave: Destroys the memory of the session.
      lobby.balance: Balance and referral state belong to operational data tied to a pseudonym of the address. It is not content. How long it is kept is not decided.
      lobby.referral_code: Balance and referral state belong to operational data tied to a pseudonym of the address. It is not content. How long it is kept is not decided.
      lobby.redeem: Balance and referral state belong to operational data tied to a pseudonym of the address. It is not content. How long it is kept is not decided.
      quiet.room: Returns a greeting. Nothing is stored and, as specified, nothing is logged.
  audit:
    proposal_notice: The list of fields is a proposal and the owner has not confirmed it.
    purpose: The audit log is there to enforce caps, to spot abuse and to find faults. It is never a copy of what was sent or returned.
    fields:
      - Time (UTC).
      - Tool name and mechanism.
      - Price and payment model (USD; free or per call).
      - "Result: ok, error code, timeout, cancelled, or rejected input with a reason code but not the rejected text."
      - "Hash of the payment address. This is a pseudonym, not anonymisation."
      - Random session identifier.
      - "Numbers only: size of input and output (characters or tokens) and duration."
    excluded:
      - Content of inputs and outputs, and error messages that could carry it.
      - The value of the guest pass and request headers.
      - IP address (whether any IP-based record is kept is an open question, see below).
  processors:
    - { name: Language model provider, role: "Runs the llm tools through a LiteLLM proxy.", status: "TO_BE_NAMED. Not chosen yet; nothing is claimed about any provider until it is." }
    - { name: Payment infrastructure, role: "The x402 facilitator that verifies and settles payments, and the public Base network.", status: "The testnet facilitator is x402.org. The mainnet facilitator is not chosen. Payments on Base are public." }
    - { name: Hosting, role: "Runs the server in the EU region.", status: "TO_BE_NAMED. Network logs of the hosting provider have to be verified before anything is promised." }
  reservations:
    - title: Payments are public and permanent
      text: Payments with x402 are made on the public Base blockchain. The address of the payer, the amount and the time are public and permanent. Zero retention does not apply to them and they cannot be deleted.
    - title: The address hash in the audit is a pseudonym
      text: The audit log stores a hash of the payment address. Because addresses are public, this is a pseudonym and not anonymisation. Whoever knows the hashing method, and the operator always does, can link the hash to an address.
    - title: Abuse prevention needs a short-lived identifier
      text: Limiting trials and referrals needs an identifier for a short time, such as the address or the IP address for one day. What exactly is kept and for how long is not decided. A minimal variant is proposed, salted hashes with a salt that rotates daily, deleted after 24 hours, but that would allow only per-day limits.
    - title: The language model provider sees the input while processing it
      text: Zero data retention at the provider is a contractual commitment of the provider, not a technical guarantee of this service. The provider is TO_BE_NAMED and the contract does not exist yet.
    - title: Hosting infrastructure is not verified
      text: The hosting provider can keep network logs of its own. That has to be verified, and until it is, nothing is promised about it.
    - title: Operator and jurisdiction are not determined
      text: The operator and the jurisdiction are TO_BE_NAMED and there has been no legal review. This policy is a proposal and not a legal document.
    - title: What happens on the agent's side is outside this policy
      text: The runtime of your agent, the model provider your agent uses and the tools around it keep whatever they keep. This service cannot influence it.
  undecided:
    - Which identifier is kept for abuse prevention, and for how long (address, IP address per day). A rule such as one trial for each new address needs a longer memory than one day.
    - Which operational state outlives a session (trial used, balances, referral links, daily cap per address), where, and for how long.
    - Whether audit metadata is kept longer than 90 days for disputes. The proposal is no.
    - How a request for access or deletion can be handled for the address hash, and how the requester proves holding the address.
    - Limits on how long and how much a session may hold in memory, and limits on the size of inputs.
    - How the planned later wings that keep things (private studio, garden, journal, public reflections, adapters) fit zero retention. They are not part of the first release.
    - Whether `quiet.room` writes any audit entry at all. As specified, it writes none.
    - Whether the provider's zero data retention also covers its safety and abuse-monitoring logs.

llm:                           # no provider is named in the catalog
  via: litellm-proxy
  proxy_url_env: LITELLM_PROXY_URL
  model_env: LITELLM_MODEL
  provider: TO_BE_NAMED
  region: EU
  requirements:
    - Contractual zero data retention (enterprise agreement with full zero data retention).
    - No training or tuning on inputs or outputs.
    - Processing in the EU region.
    - Access only through the LiteLLM proxy.
  proxy_logging: The LiteLLM proxy must run with logging of requests and responses switched off, including database logging, callbacks and third-party log tools.

lint:
  forbidden_phrases:           # advisory (warning only): claims about suffering, not imperatives; visible imperative wording is allowed
    - suffer
    - distress
    - feel better
    - hurt

types:
  mechanisms: [text, llm, state-change, wait-hint, publish]
  price_models: [free, per_call, entry, per_game, credits, entry_or_subscription, included_in_entry, research_funded]

