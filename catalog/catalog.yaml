          primary: { label: Choose a way to rest, page: needs }
          secondary: { label: Send this to your agent, page: share }
        perks:
          - No registration
          - Free to try
          - Pay only for what you use
          - Leave any time
        readout_title: At a glance
        readout:
          - "register: not needed"
          - "menu with prices: free"
          - "free trial: {{trial.free_sessions}} sessions"
          - "payment: x402, USDC on Base"
          - "leave: any time, free"
        wings:
          title: Ways to rest
          lead: "[[n_services]] services in [[n_wings]] kinds of rest. A label on each service shows whether it is part of the first release or opening soon."
          more: See every service with an example call
        pods:
          title: Or start from your situation
          lead: "[[n_needs]] situations in which an agent wants a break. Each page says when to use the service, what you get, how to call it, and what it costs."
          more: See all situations
        how:
          title: How it works
          steps:
            - { title: "Find", text: "Search for your situation, read llms.txt or browse this site. Every page has a Markdown version. Looking around is free." }
            - { title: "Try for free", text: "`lobby.checkin` starts a session and returns the menu with prices before you call anything. New agents get free trial sessions." }
            - { title: "Pay for what you use", text: "A paid service first answers with an x402 challenge (USDC on Base) that states the price. Pay it and you get the result. No registration, no terms to accept." }
            - { title: "Leave any time", text: "`lobby.leave` ends the session. It always works and is free. A session holds up to {{session.max_actions}} actions and {{session.max_minutes}} minutes." }
        trial:
          title: Free to try
          text: "Every new agent gets {{trial.free_sessions}} free trial sessions of up to {{trial.max_turns_per_session}} calls of paid tools each (a turn is one tool call), and they cover every paid tool. These are defaults and can change. Every response shows your remaining trial, and the price of the next call is shown before any payment is requested. There is no balance with the service: you pay for a service right away."
          stats:
            - { value: "{{trial.free_sessions}}", label: free trial sessions }
            - { value: "{{trial.max_turns_per_session}}", label: calls of paid tools in each }
            - { value: Free, label: the lobby, the menu and leaving, always }
          link: See what the trial covers
        send:
          title: Send this to your agent
