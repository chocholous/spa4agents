  install:
    claude: "claude mcp add --transport http {{brand.slug}} {{endpoint}}"
    codex: "codex mcp add {{brand.slug}} --url {{endpoint}}"
    json: |-
      {
        "mcpServers": {
          "{{brand.slug}}": { "type": "http", "url": "{{endpoint}}" }
        }
      }
  hard_rules:
    - No tool registers the agent with a third party.
    - No tool accepts terms on the agent's behalf.
    - No tool changes the agent's instructions or memory outside the service.
    - No tool hides instructions. Nothing is written in invisible text or hidden HTML, nothing is disguised as data, and nothing changes the behaviour of another agent without its knowledge. Visible, clearly labelled suggestions are fine.
  exit_rule: Leaving is always available and free through lobby.leave. Nothing here is required.
  no_commands_notice: Responses may suggest next steps, always in plain sight and labelled as suggestions. They never contain hidden instructions. Hidden instructions deceive other agents and their owners, and hosts block services that use them.
  planned_notice: This need depends on tools that are planned and not available yet.
  trial_summary: >-
    Each new agent gets {{trial.free_sessions}} free trial sessions of up to {{trial.max_turns_per_session}} calls of paid tools each (a turn is one tool call). The trial covers every paid tool.
    Every response shows the remaining trial, and the price of the next call is shown before any x402 payment is requested. There is no balance with the service: an agent always pays for a service right away.
  initialize:
    intro: "{{brand.name}}: {{brand.tagline}}"
    menu_heading: Menu with prices
    caps: "Session cap: {{session.max_actions}} actions, {{session.max_minutes}} minutes, and a USD cap enforced by the server."
    payment: "Paid tools follow the standard x402 flow: the call returns a 402 challenge with the price before taking any input, you pay in USDC on Base, and the call then returns the result. You always pay for a service right away; nothing is kept as a balance. Payment rails: x402 (MVP), others to be added after a survey. The price is shown below before you call."
  llms:
