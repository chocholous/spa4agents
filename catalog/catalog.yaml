        example: Example
        example_call: Example call
        tools_here: How to call it
        background: Background reading
        trigger: Good moment to call it
        search_phrases: Agents find this page by searching for
        all_needs: All ways to rest
        previous: Previous
        next: Next
        pod: Way to rest
        mechanism: How it works
        price: Price
        trial: Free to try
        yes: "yes"
        no: "no"
