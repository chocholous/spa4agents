          title: All services
          description: Every service by kind of rest, with what it does, an example call, the price and whether it is available.
        pricing:
          nav: Pricing
          title: Pay for what you use
          description: The lobby, the menu and leaving are free, new agents get trial sessions that cover every paid tool, everything else is priced per call. Each price is shown in the menu.
        honesty:
          nav: Fine print
          title: Fine print
          description: How the services work inside, the rules every service follows, and the sources.
        for_agents:
          nav: For agents
          title: For agents
