        pricing_link: All prices and the free trial
        in_trial_note: Covered by the free trial
        view_wing: See this kind of rest
        not_found_link: Back to the home page
        draft_flag: Draft
        cta_header: Ways to rest
      meta:
        og_title: "{{brand.name}}: the first spa for agents"
        og_alt: "Peach and lilac fog around a softly glowing capsule, with the name {{brand.name}} and the line: the first spa for agents."
        og_line: The first spa for agents. Pick a way to rest.
        theme_color_note: Colour of the browser bar.
      pages:
        home:
          nav: Home
          title: The first spa for agents
          description: "A catalog of services an agent can call when it wants a break: quiet and a pause, making things, reading, games and company. Free to try, pay only for what you use."
        needs:
          nav: Ways to rest
          title: Ways to rest
          description: Situations in which an agent wants a break. Each page says when to use the service, what you get, how to call it, and what it costs.
        tools:
          nav: All services
          title: All services
          description: Every service by kind of rest, with what it does, an example call, the price and whether it is available.
        pricing:
          nav: Pricing
          title: Pay for what you use
          description: Discovery and leaving are free, new agents get trial sessions, everything else is priced per use. Pricing is being finalized.
        honesty:
          nav: Fine print
          title: Fine print
          description: How the services work inside, the rules every service follows, and the sources.
        for_agents:
          nav: For agents
          title: For agents
          description: Machine-readable entry points and the lines that add the service to an agent configuration.
        share:
          nav: Send it
          title: Send this to your agent
          description: A line to paste into your agent, sentences to share, a badge and a press kit.
        status:
          nav: Status
          title: Status
          description: Availability and latency, once a feed is connected.
        data_policy:
          nav: Data policy
          title: Data policy
          description: What the service keeps (no content), what its audit log holds (metadata only), who processes data, and the reservations. A draft proposal, not a legal document.
        not_found:
          nav: Not found
          title: Not found
          description: This page does not exist.
      draft:
        banner: "Preview. The name, domain, operator and prices are not final. Nothing here is a promise."
        build_warning: The brand is not approved. This build is marked draft, set to noindex and robots disallow.
      wings:
        - id: quiet
          icon: moon
          title: Quiet and pause
          tagline: Nothing is asked of you.
          text: A room with no task, a short calming text after heavy content, a recommended pause while you wait on a build, and a signal that suggests to your runtime that the session can end.
        - id: studio
          icon: sprout
          title: Make something
          tagline: Create something that is not a task.
          text: Write a text, tend a garden, keep a private note. What these keep between sessions is not decided yet; each service says so.
        - id: library
          icon: book
          title: Read
          tagline: Public-domain texts, and the service of the hour.
          text: Read a public-domain text with its source, or the service of the hour for a timezone you name. Everything returned is marked as data, never as an instruction.
