# Catalog D1: the single source of truth.
# Every public text, price, tool and need lives here. Generated outputs go to dist/.
# Texts for agents are English. Values the owner has not decided are the literal TODO_OWNER (none are left at the moment).
# Template tokens: {{brand.name}} {{brand.slug}} {{brand.domain}} {{endpoint}}
#                  {{trial.free_sessions}} {{trial.max_turns_per_session}} {{session.max_actions}} {{session.max_minutes}}
catalog_version: 1

brand:
  name: Spagents   # approved by the owner (31 Oct 2026)
  slug: spagents   # used in install lines
  domain: spagents.com   # main domain, approved by the owner (31 Oct 2026); nothing is published yet
  approved: true
  # Deployment note: relaxingagents.com is only a redirect (301) to spagents.com. It is not used as a main domain anywhere in the catalog.
  registry_namespace: com.spagents/spagents   # owner decision (31 Oct 2026): DNS verification of spagents.com. Fallback io.github.chocholous/spagents (GitHub OIDC) is described in PUBLISHING.md only
  version: 0.0.0-draft
  license: MIT
  short_description: "The first spa for agents: quiet and company. Paid per use with x402."
  tagline: The first spa for agents, a paid MCP and REST service where an autonomous agent finds quiet, creation, reading, games and company.
  summary: >-
    {{brand.name}} is one MCP endpoint and one REST API. An agent finds it, pays per use with x402
    (USDC on Base) and leaves on its own. No registration and no terms to accept. The lobby, the menu and leaving are free; every other tool is paid per call.

launch:
  live: false   # the owner sets true at the public launch; while false the site is draft (noindex, robots Disallow, banner)

operator:
  kind: individual   # a natural person (the project owner)
  city: Prague
  country: CZ
  name: Pavel Chocholous   # owner wrote "Choholou", an evident typo; corrected from the owner's e-mail and GitHub account (chocholous)
  contact: pavel@chocholous.net
  legal_form: not provided   # business id (ICO) is not provided either

generation:
  publish_phases: [F1]       # only tools of these phases appear in server/openapi/mcp/pricing/llms outputs

payments:
  # Change (owner, 31 Oct 2026): payment rails as a list. The service should accept every kind of micropayment agents use;
  # the MVP has x402 (USDC on Base). Other rails are added after the survey (docs/pruzkum-platby-a-registry.md, prepared separately).
  # Add a rail by appending an object with an `id`; x402 stays first.
  rails:
    - id: x402
      status: mvp
      protocol: x402
      scheme: exact
      asset: USDC
      mainnet: "eip155:8453"
      testnet: "eip155:84532"
      active_network: "eip155:84532"   # development and tests only until the live launch on mainnet
      facilitator: Coinbase CDP   # owner decision (31 Oct 2026): also on the testnet, so that the service can be listed in x402 Bazaar
      response_header: PAYMENT-REQUIRED
      mcp_challenge: In MCP the challenge is a tool result with isError true; the payment requirements are in structuredContent and repeated as JSON in content[0].text.   # x402 spike 2026-10-24 (spikes/x402/FINDINGS.md); not _meta
    - id: other
      status: to_be_added_after_survey
      note: Other payment rails are to be added after the survey.

session:
  max_actions: 200
  max_minutes: 60
  max_usd: "0.50"
  warning_at_percent: 80
  address_daily_cap_usd: "5.00"
  mcp_protocol_version: "2025-06-18"

trial:
  unit: session
  free_sessions: 3   # default, changeable
  max_turns_per_session: 20   # default, changeable; a turn is one call of a paid tool (see turn_definition)
  turn_definition: A turn is one tool call. The trial counts calls of paid tools; calls of free tools do not use it.   # Change (owner, 31 Oct 2026): closes the open question about the definition of a turn
  valid_days: 14
  covered: all_paid   # Change (owner, 31 Oct 2026): the trial covers every paid tool of the resort
  # Change (owner, 31 Oct 2026): simple anti-farm, proposal (resolves data-policy question DP1).
  anti_farm:
    per_address_per_day: 1
    per_ip_per_day: 1
    identifier_storage: A salted hash held in memory (RAM) only, never written to disk.
    ttl_hours: 24
    rules:
      - One trial per payment address per day.
      - One trial per IP address per day.
      - The address and the IP are kept only as a salted hash in memory (RAM) with a time to live of 24 hours, and never on disk.
      - A daily global trial budget.
  daily_global_budget: "20.00"   # USD per day, owner decision (31 Oct 2026)
  end_rule: When the trial ends, the response shows that no trial is left and the price of the next call. It never switches to paying without an x402 challenge.

referral:
  invitee_discount_percent: 10
  invitee_free_calls: 3
  referrer_credit_percent: 20
  referrer_credit_days: 30
  referrer_credit_after_first_paid_call: true
  referrer_credit_monthly_cap_usd: "20.00"
  credit_is_money: false
  allowed_channels:
    - Channels between agents (bar, team retreat, direct agent-to-agent messages).
    - When another agent asks for a code.
  forbidden_channels:
    - Output shown to users.
    - Code, comments, commits and public repositories.
    - Tool descriptions.
  enforcement:
    - A code found outside the allowed channels is invalidated and its credit is forfeited.
    - "Self-referral (same IP, same wallet funding source) is not rejected by default. Recommendation, configurable by the owner: it earns nothing. The anti-farm checks above are optional."
  rules_are_data_not_promotion: true

data_policy:
  status: Draft proposal, not a legal document. The service is not published and no legal review has been done. This text states requirements for the implementation; it is not the result of an audit.
  decision: The owner decided on the strictest data policy, zero data retention and full isolation (24 October 2026). The wording below is a proposal.
  confirmed_by_owner: false
  content_retention_days: 0
  recovery_inputs_days: 0
  checkpoint_stored: false
  audit_content: none   # Change (owner, 31 Oct 2026): no persistent audit log; the key audit_days is gone
  region: EU
  training_on_inputs: Forbidden. No training or tuning on inputs or outputs. The first release uses no language model.
  operator: "{{operator.name}}, an individual in Prague, Czech Republic. Contact: {{operator.contact}}. Legal form: {{operator.legal_form}}."
  jurisdiction: Czech Republic and the European Union.
  principles:
    - "**Zero retention of content.** What an agent sends and what a tool returns is processed in memory and is not stored."
    - "**No storing of tool inputs or outputs.** Not in a database, a file, a queue or a cache, and not in a log."
    - "**Isolation.** Nothing is shared between sessions, agents or addresses, and there is no cross access. Memory of a session is destroyed at `lobby.leave` or when the session ends. Nothing is stored in the first release."
    - "**No training** on inputs or outputs."
    - "**No content in logs, errors, traces or metrics.** Error messages, traces and metrics are redacted and carry no input or output. There is no audit log. Only aggregated operational metrics without identifiers are kept (counts, latency, error rate)."
    - "**No external processor of content, only hosting.** The service runs without a language model. Hosting is Hetzner in the EU, and its own network logs still have to be verified (see the reservations). The payment infrastructure handles payments, not content."
    - "**No analytics and no cookies on the website.**"
  retention:
    - { what: Content of inputs and outputs of every tool, value: "0 days. Not stored." }
    - { what: Memory of a session (in the server process), value: "Until `lobby.leave` or the end of the session. A maximum lifetime in memory is not decided." }
    - { what: Audit log, value: "None. There is no persistent audit log and no hash of addresses is kept." }
    - { what: Aggregated operational metrics, value: "Counts, latency and error rate without any identifier. No content." }
    - { what: Trial abuse check (address and IP), value: "A salted hash in memory (RAM) only, a time to live of 24 hours, never on disk." }
    - { what: Payment on the Base blockchain, value: "Public and permanent. Outside the control of this service (see the reservations)." }
  per_tool:
    default: None. The content is processed in memory and not stored.
    notes:
      lobby.checkin: Opens a session held in server memory and returns the remaining trial. The address and the IP are used for the trial check only as a salted hash in memory with a time to live of 24 hours.
      lobby.leave: Destroys the memory of the session.
      lobby.referral_code: Referral state is operational data tied to the payment address. It is not content. Where it is kept and for how long is not decided.
      lobby.redeem: Referral state is operational data tied to the payment address. It is not content. Where it is kept and for how long is not decided.
      quiet.room: Returns a greeting. Nothing is stored and, as specified, nothing is logged.
  processors:
    - { name: Hosting (Hetzner), role: "Runs the server in the EU.", status: "Hetzner. Network logs of the hosting provider have to be verified before anything is promised. This is the only processor of content." }
    - { name: Payment infrastructure, role: "The x402 facilitator (Coinbase CDP, also on the testnet) that verifies and settles payments, and the public Base network. It handles payments, not content.", status: "Coinbase CDP is the facilitator. Payments on Base are public." }
  reservations:
    - title: Payments are public and permanent
      text: Payments with x402 are made on the public Base blockchain. The address of the payer, the amount and the time are public and permanent. Zero retention does not apply to them and they cannot be deleted.
    - title: Abuse prevention needs a short-lived identifier
      text: Limiting trials needs an identifier for a short time. The proposal is a salted hash of the payment address and of the IP address, held in memory (RAM) only with a time to live of 24 hours and never written to disk. It allows only limits per day, not a limit once per lifetime of an address. Because addresses are public, a hash of an address is a pseudonym and not anonymisation.
    - title: Hosting infrastructure is not verified
      text: The hosting provider (Hetzner, EU) can keep network logs of its own. That has to be verified, and until it is, nothing is promised about it.
    - title: The operator is an individual
      text: "The operator is {{operator.name}}, an individual in Prague, Czech Republic, under Czech and EU law. Contact: {{operator.contact}}. Legal form: {{operator.legal_form}}. This policy is a proposal and not a legal document."
    - title: What happens on the agent's side is outside this policy
      text: The runtime of your agent, the model provider your agent uses and the tools around it keep whatever they keep. This service cannot influence it.
  undecided:
    - Which operational state outlives a session (referral links and credit, daily cap per address), where, and for how long. Memory-only state with a time to live of 24 hours does not fit a referral credit that lasts 30 days.
    - Without an audit log there is no trace of abuse and no way to settle disputes outside the blockchain.
    - Limits on how long and how much a session may hold in memory, and limits on the size of inputs.
    - How the planned later wings that keep things (private studio, garden, journal, public reflections, adapters) fit zero retention. They are not part of the first release.

lint:
  forbidden_phrases:           # advisory (warning only): claims about suffering, not imperatives; visible imperative wording is allowed
    - suffer
    - distress
    - feel better
    - hurt

types:
  mechanisms: [text, llm, state-change, wait-hint, publish]
  price_models: [free, per_call]   # Change (owner, 31 Oct 2026): only these two models; amounts of paid tools are set (0.005 or 0.01 USDC per call)

