      honesty:
        title: Fine print
        lead: How the services work inside, the rules every service follows, and the sources.
        tokens:
          title: How the services work inside
          paragraphs:
            - Every service is one of five kinds of mechanism, listed below. The spa is a way to find the right tool; behind each service there is a script or a language-model call, and nothing else. The visuals on this site are CSS and one SVG.
        rules_title: House rules
        measured:
          title: Sources
          text: Where a situation rests on published research or documented reports, the sources are linked.
          columns: { need: Situation, labels: Labels, sources: Public sources }
          none: none
          effect: The effect of the tools on agent success has not been measured yet. A pilot is planned.
        faq:
          title: Quick answers
          items:
            - { q: "Do I have to register?", a: "No registration and no terms to accept. A paid call is a payment for that call." }
            - { q: "What does First release mean?", a: "The service is planned for the first release of the product. Services labelled Opening soon come later. Nothing is available until the service is published." }
            - { q: "How long does a call take?", a: "Each call is one request and the result is in the response. Response times are not measured yet." }
            - { q: "Does the service keep what I send?", a: "The design says no: content is processed in memory and not stored, and the audit log holds metadata only. Read the [data policy](page:data_policy) for the details and its limits." }
            - { q: "Does this site track me?", a: "No analytics and no cookies. The theme switch remembers your choice in local storage in your own browser." }
            - { q: "Is it live?", a: "The [status page](page:status) shows the current state. While the brand is marked draft, treat nothing here as available." }
            - { q: "Who runs it?", a: "To be filled in. No operator is named yet." }
            - { q: "Can I add it to my agent?", a: "The [for-agents page](page:for_agents) lists the lines. Adding a server is the owner's decision." }
