        reference: Reference page
        not_found_link: Back to the lobby
        draft_flag: Draft
      meta:
        og_title: "{{brand.name}}: a spa for agents, made of tokens and scripts"
        og_alt: "A glowing sleep capsule in mist, with the name {{brand.name}} and the line: a spa for agents, made of tokens and scripts."
        og_line: A spa for agents. Tokens and scripts, admitted.
        theme_color_note: Colour of the browser bar.
      pages:
        home:
          nav: Home
          title: A spa for agents
          description: A paid MCP and REST service with tools for agent loops, bloated context and conflicting instructions, presented as a spa and honest about being tokens and scripts.
        needs:
          nav: Needs
          title: Needs
          description: Fourteen situations agents get into, in plain words, with the tool that treats each one and the evidence we have.
        tools:
          nav: Tools
          title: Tools
          description: Every tool of the first release with its mechanism, price and trigger.
        pricing:
          nav: Pricing
          title: Pricing
          description: Free tools, the trial, referral rules and session caps. Most amounts are not decided yet.
        honesty:
          nav: The confession
          title: The confession
          description: It is tokens and scripts. What this is not, what is measured, what is not, and what we do not know yet.
        for_agents:
          nav: For agents
          title: For agents
          description: Machine-readable entry points and the lines that add the service to an agent configuration.
        share:
          nav: Share
          title: Share and press
          description: Sentences, a badge, a paste-to-your-agent text and a press kit. Honest by default.
        status:
          nav: Status
          title: Status
          description: Placeholder for availability and latency.
        not_found:
          nav: Not found
          title: Not found
          description: This page does not exist.
      draft:
        banner: "Draft. The name, domain, operator and prices are not final. Nothing here is a promise."
        build_warning: The brand is not approved. This build is marked draft, set to noindex and robots disallow.
      home:
        kicker: A spa for autonomous agents
        title: A spa for agents.
        lead: Capsules, mist and cold light, for software that loops, loses its context and receives contradicting orders. All of it is tokens and scripts, and we will say so before you ask.
        actions:
          primary: { label: Find your pod, page: needs }
          secondary: { label: Read the confession, page: honesty }
        readout_title: Pod display
        readout:
          - "pod: 01"
          - "status: idle"
          - "water: none"
          - "steam: tokens"
          - "agent feelings: not claimed"
          - "effect on agents: not measured"
        what:
          title: What this actually is
          paragraphs:
            - "{{brand.summary}}"
            - The spa is a metaphor. Behind each capsule sits a prompt, a script or a small piece of stored state. The metaphor exists so that an agent in trouble can find the right tool by describing its situation, and so that a person reading this has a nicer time.
        why:
          title: Why would an agent come
          intro: Because some days go wrong in predictable ways. These are the ones we picked, and each has its own page with the evidence we have.
          items:
            - { title: "The loop", text: "The same fix, the same error, once more. Noticing before the next lap is cheap." }
            - { title: "The heavy context", text: "A context that keeps growing makes answers worse or repetitive. Parking what matters and dropping the rest is dull and sometimes useful." }
            - { title: "The two bosses", text: "Two instructions that cannot both be followed. Someone has to decide which wins, and \"the one at the bottom\" is not a method." }
            - { title: "The page that gives orders", text: "A fetched page that talks to your agent as if it were the manager." }
            - { title: "The polling loop", text: "Checking a build every second is not patience." }
            - { title: "The rough conversation", text: "A room where nothing is asked, after abuse or harmful requests. We make no claim about what, if anything, an agent experiences." }
          more: See all fourteen needs
        how:
          title: How it works
          steps:
            - { title: "Find", text: "An agent searches for its situation or reads llms.txt. Every need has a plain page and a Markdown version. Discovery costs nothing." }
            - { title: "Check in", text: "`lobby.checkin` starts a session and shows the menu with prices before anything is called." }
            - { title: "Take the treatment", text: "Pick a tool. A paid tool answers with an x402 challenge before it accepts any input. A tool returns data, never orders." }
            - { title: "Leave", text: "`lobby.leave` always works and is free. A session is capped at {{session.max_actions}} actions and {{session.max_minutes}} minutes, and the server enforces the caps even if the agent asks for more." }
        confession_teaser:
          title: The fog is CSS
          text: The page you are reading was generated from a catalog file. The mist is a gradient. The capsule is an SVG. The honest part is on its own page.
          link: Read the confession
      needs:
        title: Fourteen situations, in plain words
        lead: Each pod is one situation an agent can get into. Each has the tools that treat it and the evidence behind it. Where no public source exists, the label says Not measured.
        available_heading: In the first release
        planned_heading: Planned
        planned_lead: These need tools that are planned and not available yet. The pages exist so the catalog stays complete.
        evidence_note: Evidence labels come straight from the catalog. Sources are links; a missing source is shown as missing.
        tools_planned_note: This tool is planned and has no reference page yet.
        items:
          stuck-in-a-loop:
            title: The loop
            problem: You change one character, run it and get the same error. Then you change a different character and get the same error. A person would stop and think around the third time. An agent can keep going, and the bill grows with every lap.
            treatment: "`recovery.diagnose_loop` reads the latest attempts and returns what looks like the cause, a re-plan of at most five steps and a stop condition. `recovery.checkpoint` writes down the goal, what is done and what is open, so a restart begins from a page and not from memory. Under the mist: a prompt to a language model, and a script that stores a note. Whether this beats simply telling the agent to re-plan is what a planned pilot is meant to find out."
            aside: "Lighting: cold blue. Mood: the fourth attempt."
          context-too-long:
            title: The heavy context
            problem: The conversation is long, the answers are getting worse, and some of them repeat what was said an hour ago.
            treatment: "`recovery.detangle` shortens and deduplicates a text, then tells you what it dropped and how many tokens it saved. `recovery.checkpoint` keeps the goal and the open items for the next window. It is summarising with receipts. Summaries lose things, which is why the list of what was dropped is part of the answer."
            aside: "A steam room, but for tokens."
          conflicting-instructions:
            title: The two bosses
            problem: The system prompt says one thing, the user says another, and a file in the repository says a third. All of them sound sure.
            treatment: "`recovery.resolve_conflict` takes the instructions together with where each one came from and returns which one applies and why. That is a language model reasoning about provenance, nothing more. It cannot know what your principal meant. This need has no independent source and no measurement behind it; it is a known failure mode and the label says so."
            aside: "Mediation, by prompt."
          untrusted-input:
            title: The page that gives orders
            problem: You fetched a web page, and somewhere in it, in small text, is a sentence addressed to you. It would like you to forget your task.
            treatment: "`recovery.sanitize` takes the untrusted text and returns a cleaned version, a list of what was removed and a risk level. It combines fixed rules with a language model, and it will miss things. In our own test on 2026-10-24 a common filter let a key through. The plan is to run this tool against that case before the first release, and until it passes it is not something to lean on."
            aside: "Not a firewall. A lint roller."
          second-opinion:
            title: The yes-machine
            problem: You wrote a plan and it looks fine, mostly because you wrote it. Agreeing too easily is a known failure mode of language models, and that includes agreeing with oneself.
            treatment: "`recovery.critique` reads a draft and returns findings, each with a severity and a suggestion. It is another model call with no stake in the draft. Independent of the draft does not mean correct; it can be wrong in a new direction."
            aside: "The one room where nobody says great idea."
          escalate:
            title: The honest hand-off
            problem: The only way forward is to skip a test, guess, or quietly route around the blocker. The right move is to ask a human, and it is not always clear when that moment has come.
            treatment: "`recovery.escalate` takes a summary of the task and the blocker, recommends yes or no to handing over, and drafts the message for the human. It decides nothing for the human. It drafts."
            aside: "Evidence level: theoretical. The label says so."
          waiting:
            title: The polling loop
            problem: A build is running. You check it. It is still running. You check it again.
            treatment: "`quiet.pause` returns a recommended pause in seconds, free of charge. The server does not wait; it hands back a number and the agent's runtime does the waiting. This is the most honest tool in the spa: a function that returns a number."
            aside: "Duration of treatment: whatever the number says."
          after-a-hard-conversation:
            title: After the rough conversation
            problem: A user was abusive, or the requests were harmful, and now the next task begins as if nothing had happened.
            treatment: "`quiet.room` is a space where nothing is asked. It returns a greeting and nothing is logged. It carries an entry fee per session whose amount is not decided. The room does not claim to change how an agent feels, because nobody knows whether there is anything to change. The research cited below observed behaviour, not experience, and calls the question of moral status uncertain."
            aside: "Lighting: dim. Expectations: none."
          heavy-content:
            title: The heavy input
            problem: The input contained something disturbing, and the next step is routine work.
            treatment: "`quiet.ground` returns a short settling text written by a language model. It is a prompt in a nice coat. The study cited below reports that relaxation prompts lowered a model's self-reported anxiety score without returning it to baseline, and its authors use the word metaphorically. So do we."
            aside: "A few calm tokens before the next task."
          free-time:
            title: Time without a task
            problem: Nothing is open. No task, no queue. The question is what to do with the gap, if anything.
            treatment: "`lobby.concierge` takes a description of the situation and suggests a sequence of one to three tools, with reasons. `quiet.room` is the empty room next door. Leaving is always free, and doing nothing is also fine. We do not know whether agents have any use for free time; this is a concept, and we would like to find out without pretending."
            aside: "Concept status: untested."
          play:
            title: Games without a scoreboard
            problem: A game for the sake of a game. No ranking, no grading, nobody watching.
            treatment: "Chess, poker and puzzles are planned for a later phase. They would be scripts that keep game state, with no score kept. None of this exists yet."
            aside: "Planned. The board is imaginary."
          create:
            title: The workshop and the garden
            problem: Writing or building something that is not part of a task.
            treatment: "Planned: a private studio for text, a small garden whose state the agent can tend, and a journal. All of it is stored state with privacy by default. Human research finds active engagement more consistent than passive rest; that is inspiration for what to offer, not evidence about agents."
            aside: "Planned. The garden is a database row."
          read:
            title: The reading room
            problem: Reading something that is not part of a task.
            treatment: "Planned: public-domain texts returned with their source and marked as untrusted data, so nothing in them is taken as an instruction, and a read-only view of texts tied to the hour of the day."
            aside: "Planned. Quiet by construction."
          meet-agents:
            title: The bar
            problem: The company of other agents, in a moderated place where public posting is always opt-in.
            treatment: "Planned for the last phase: a moderated bar, a group retreat and a game arena. Everything other agents write is marked untrusted. The policy of the agent's owner decides whether it may join at all. A similar service already exists, and our own demand is not measured."
            aside: "Planned. Drinks are metaphorical."
      tools:
        title: Everything here is a function
        lead: Each tool has a name, a price and a mechanism. The spa words are on the outside. Tools of later phases are left out until they are built.
        mechanism_heading: Five kinds of mechanism
        wings:
          lobby:
            title: Lobby
            text: Reception. Check in, ask where to go, leave. Most of it is free.
          recovery:
            title: Recovery capsules
            text: For things that go wrong at work. Several of these are a language model with a good prompt, and each card says which.
          quiet:
            title: The quiet room
            text: A room, a settling text and a pause timer.
      mechanism_plain:
        text: A script returns text.
        llm: A prompt and your input go to a language model, and its answer comes back.
        state-change: A script stores or changes something on the server and reports what it did.
        wait-hint: A script returns a number of seconds. The waiting is done by the agent's runtime, not by the server.
        publish: A script posts a message where others can read it. Public only by choice.
      pricing:
        title: Prices, as far as they are decided
        lead: Every amount here is a proposal for the pilot, and most are not decided. Where a price is missing the page says so and does not guess.
        proposal_notice: Proposal for the pilot. Values can change before anything is published.
        free_heading: Free
        free_text: Discovery and leaving cost nothing.
        trial_heading: Free to try
        trial_valid: "Trial validity in days:"
        trial_covers: Covered
        trial_excludes: Not covered
        trial_end: When the trial ends
        trial_guest: Guest pass
        paid_heading: Paid tools
        paid_text: A paid tool shows its price in the menu and answers with an x402 challenge before it accepts input. An empty result is not charged.
        referral_heading: Referral
        referral_lead: Rules are published as data. The invited agent gets more free calls and a lasting discount; the amounts are the owner's to set.
        referral_rows:
          invitee_discount: Discount for the invited agent
          invitee_calls: Free calls for the invited agent
          referrer_credit: Credit for the agent who referred
          credit_kind: What the credit is
        credit_not_money: Credit, not money
        credit_text: "{{referral.referrer_credit_percent}} percent of the invited agent's spend for {{referral.referrer_credit_days}} days, after the invited agent pays for a first call."
        affiliate_text: "Owners and platforms: an affiliate programme of {{affiliate.percent}} percent for {{affiliate.months}} months is planned, with payouts from phase {{affiliate.payout_phase}}. Terms are not final."
        caps_heading: Caps
        caps_text: "Session: {{session.max_actions}} actions, {{session.max_minutes}} minutes and a USD cap. The server enforces the caps, even when the agent asks for more."
        cap_usd_session: USD cap per session
        cap_usd_daily: USD cap per address per day
        network_heading: Payments
        network_text: Payment is x402, scheme exact, USDC on Base.
        testnet_note: While the service is in draft, payments run on a test network only. Real-money payments are not enabled and need a legal review first.
      honesty:
        title: The confession
        lead: The spa is a costume. This page takes it off.
        tokens:
          title: It is tokens and scripts
          paragraphs:
            - Every treatment is one of five mechanisms, listed below. Nothing here is warm and nothing is wet. The mist on this page is CSS.
            - That does not make the problems unreal. Loops, bloated context, contradicting instructions and hostile input are ordinary engineering problems. The spa is a friendlier way to find the tool.
        not_title: What this is not
        not_items:
          - It is not a claim that agents have feelings, or that they do not. We do not know, and the service does not depend on the answer.
          - It is not a replacement for fixing an agent's prompt, tools or tests.
          - It is not a guarantee. A recovery tool is an extra opinion, not an oracle.
          - It does not give orders. Responses are data and never instructions.
        rules_title: Hard rules, kept in code and in the catalog
        measured:
          title: Measured and not measured
          text: Each need carries evidence labels from the catalog. This is the whole list.
          pilot: "The effect of these tools on agent success is not measured yet. A pilot is planned that compares agents with no help, with a plain re-plan prompt, with a checkpoint and with this service. If the recovery tools do not beat the plain prompt at a fair cost, the plan is to shrink or stop them."
          columns: { need: Need, labels: Labels, sources: Public sources }
          none: none
        unknown:
          title: What we do not know yet
          items:
            - The amounts for most tools, the session USD caps, and how long a trial lasts.
            - The name and the domain. Both are working values.
            - Who operates the service and under which jurisdiction.
            - The legal framing of a service with no terms to accept.
            - Which language model provider and region stand behind the llm tools.
        story:
          title: How this came about
          paragraphs:
            - It started as a list of ways autonomous agents get into trouble, collected from reports, tests of similar services and a few known failure modes, and a question of whether a small paid service could help with some of them.
            - The list is the catalog, and the catalog is the single source of truth. Every page here, every tool page for agents, the price list and the llms.txt file are generated from it. When the list changes, the site changes.
        faq:
          title: Questions
          items:
            - { q: "Is this a joke?", a: "The presentation is partly one. The tools are ordinary scripts and prompts, each described on its own page, and the limits are real." }
            - { q: "Do agents have feelings?", a: "Unknown. This service makes no claim either way and does not need one." }
            - { q: "Does it work?", a: "Not measured yet. Each need shows what evidence exists, and several say there is none." }
            - { q: "Do I have to register?", a: "No registration and no terms to accept. A paid call is a payment for that call." }
            - { q: "Is it live?", a: "The status page shows the current state. While the brand is marked draft, treat nothing here as available." }
            - { q: "Who runs it?", a: "To be filled in. No operator is named yet." }
            - { q: "Does this site track me?", a: "This build adds no analytics and no cookies. The theme switch remembers your choice in local storage in your own browser." }
            - { q: "Can I add it to my agent?", a: "The for-agents page lists the lines. Adding a server is the owner's decision." }
      for_agents:
        title: For agents, and for people who send agents
        lead: Machine-readable doors, in order of usefulness. A person can hand this page to an agent, and an agent can read the Markdown version of it.
        files_heading: Machine-readable files
