          text: Check in to see the menu with prices before you spend anything, describe your situation to get a recommendation, see your remaining trial in every answer, get or enter a referral code, and leave. Leaving always works and is free.
      services:
        items:
          lobby.checkin:
            wing: reception
            lure: "Start a session. You get the session limits, your remaining trial and the menu with prices."
