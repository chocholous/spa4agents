  workflow: |-
    name: Publish to the MCP Registry
    # Manual only: nothing publishes automatically. Repository: {{repo.github}}. The namespace {{brand.registry_namespace}} is proven by a DNS record on {{brand.domain}}.
    on:
      workflow_dispatch:
        inputs:
          confirm:
            description: Type publish to confirm
            required: true
    permissions:
      contents: read
    jobs:
      publish:
        if: inputs.confirm == 'publish'
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Install mcp-publisher
            run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          - name: Log in with the DNS key
            run: ./mcp-publisher login dns --domain {{brand.domain}} --private-key "$MCP_PRIVATE_KEY"
            env:
              MCP_PRIVATE_KEY: @@secrets.MCP_PRIVATE_KEY@@
          - name: Publish server.json
            run: ./mcp-publisher publish
  publishing: |-
    # PUBLISHING.md (jen pro vlastníka)

    Tento soubor je generovaný z katalogu a NEPATŘÍ do veřejného repozitáře. Je v `.gitignore` složky; při kopírování složky ho vynech. Nic z níže uvedeného se neprovedlo, nic nebylo ověřeno proti živým službám (postupy jsou z `docs/pruzkum-platby-a-registry.md`, stav 31. 10. 2026).

    ## 0. Než začneš

    1. `operator.name` (`{{operator.name}}`) a `operator.contact` (`{{operator.contact}}`) jsou v katalogu vyplněny (ovlivňují `LICENSE`, `SECURITY.md`). Po každé změně katalogu spusť `npm run generate && npm run generate:repo` v `catalog/`.
    2. Zápis do registrů je veřejný.
    3. `launch.live` v katalogu zůstává `false`, dokud nespustíš veřejně; README pak říká „draft“. Po spuštění ho přepni a přegeneruj.
    4. `brand.version` je `{{brand.version}}`. Zvaž, jestli registr přijme tuto verzi, nebo nastav běžné číslo verze v katalogu (otevřená otázka).

    ## 1. Založení repozitáře na GitHubu

    1. Na GitHubu vytvoř nový prázdný veřejný repozitář `{{repo.github}}` (účet `chocholous`, název `spagents`; rozhodnutí vlastníka).
    2. Zkopíruj obsah složky `public-repo/` bez `PUBLISHING.md` a bez `.git`.
    3. Topics: `mcp`, `x402`, `ai-agents`. Licence je MIT (`LICENSE`).
    4. Až v repozitáři zapni Actions. Workflow `.github/workflows/publish-mcp-registry.yml` se spouští jen ručně (`workflow_dispatch`).

    ## 2. DNS ověření domény {{brand.domain}} (nutné pro `{{brand.registry_namespace}}`)

    Jmenný prostor `com.<doména>/...` v oficiálním MCP Registry se dokazuje vlastnictvím domény. Repozitář ani balíček není potřeba, server je vzdálený (`remotes` v `server.json`, URL {{endpoint}}).

    1. Vygeneruj pár klíčů Ed25519 (podle `modelcontextprotocol.io/registry/authentication`; příkaz zkontroluj v aktuální dokumentaci). Soukromý klíč drž mimo repozitář.
    2. Do DNS domény {{brand.domain}} přidej TXT záznam s veřejným klíčem ve tvaru, který udává dokumentace (`v=MCPv1; k=ed25519; p=<veřejný klíč>`). Alternativa: soubor `/.well-known/mcp-registry-auth` na webu (HTTP ověření).
    3. Soukromý klíč ulož jako tajný klíč repozitáře `MCP_PRIVATE_KEY` (Settings, Secrets and variables, Actions). GitHub OIDC se pro tento jmenný prostor nepoužije: patří jen jmenným prostorům `io.github.<účet>/...`.
    4. Počkej na šíření DNS, pak pokračuj.

    ### Záložní varianta: `io.github.chocholous/spagents` s GitHub OIDC

    Použij ji, jen kdyby DNS ověření domény {{brand.domain}} nešlo (rozhodnutí vlastníka: výchozí zůstává `{{brand.registry_namespace}}`). Neověřeno proti živému registru, postup zkontroluj v dokumentaci `modelcontextprotocol.io/registry/authentication`.

    1. V katalogu změň `brand.registry_namespace` na `io.github.chocholous/spagents` a přegeneruj (`npm run generate && npm run generate:repo`). Ověření je účtem GitHub `chocholous`, DNS ani soukromý klíč `MCP_PRIVATE_KEY` se nepoužijí.
    2. V workflow `.github/workflows/publish-mcp-registry.yml` nahraď krok „Log in with the DNS key“ přihlášením `./mcp-publisher login github-oidc` a do `permissions` přidej `id-token: write`. Ruční varianta mimo Actions: `mcp-publisher login github` (zařízení, přihlášení účtem `chocholous`).
    3. Publikace se pak dělá stejně jako v bodě 3.

    ## 3. Oficiální MCP Registry

    1. Lokálně nebo v Actions: `mcp-publisher login dns --domain {{brand.domain}} --private-key <klíč>`, potom `mcp-publisher publish` ve složce se `server.json`.
    2. Přes Actions: Actions, „Publish to the MCP Registry“, Run workflow, do pole napiš `publish`.
    3. Registr je ve stavu preview (mohou nastat resety dat). PulseMCP a další adresáře se z něj plní samy, ruční zápis do PulseMCP je pozastaven.

    ## 4. Další adresáře

    - Smithery: web `smithery.ai/new` nebo `smithery mcp publish "{{endpoint}}" -n @org/server`. Povol User-Agent `SmitheryBot/1.0` nebo vystav `/.well-known/mcp/server-card.json`. Nový záznam může začít jako „unlisted“, pak ho přepni (neověřeno). Cena a podmínky neověřeny.
    - Glama: „Add Server“ s URL repozitáře (potřebuje README, LICENSE a aspoň jeden nástroj); vzdálený konektor lze „claimnout“ HTTP výzvou nebo DNS tokenem.
    - mcp.so: formulář `mcp.so/submit` (URL repozitáře nebo serveru). Zda je zápis zdarma, je neověřeno.
    - Anthropic Connectors Directory: formulář „Connectors Directory server review“; vyžaduje funkční vzdálený server a dokumentaci (volitelné, později).
    - x402 Bazaar (Coinbase CDP): až po PRVNÍ skutečné placené platbě přes facilitátora CDP; v placených trasách musí být `extensions.bazaar`. Záznam bez settlementu po 30 dnech zmizí. Facilitátor je Coinbase CDP (rozhodnutí vlastníka, i na testnetu kvůli zápisu do Bazaaru); jestli Bazaar zapisuje i testnetové platby, je neověřeno.
    - Nezapisovat: awesome-mcp-servers a Docker MCP Catalog vyžadují repozitář se spustitelným serverem nebo image, což zde není.

    ## 5. Co zkontrolovat po zápisu

    Server musí odpovídat na {{endpoint}} a webové soubory `llms.txt`, `pricing.json` a `/.well-known/mcp.json` musí vracet správný typ obsahu. Kontrola je v balíčku `web/`. Nic z toho tento soubor nespouští.
