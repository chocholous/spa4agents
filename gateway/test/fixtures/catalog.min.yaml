# Testovací fixture. NENÍ to katalog D1; jen pole, která gateway čte (viz gateway/NOTES.md).
service:
  name: agent-spa
tools:
  - name: lobby.checkin
    description: "Use first. Opens a session and returns the menu with prices."
    mechanism: state-change
    price: { model: free }
    phase: F1
    input_schema:
      type: object
      properties:
        nickname: { type: string }
        guest_pass: { type: string }
  - name: lobby.find_tool
    description: "Use when unsure which tool fits. Returns a recommendation or none."
    mechanism: text
    price: { model: free }
    phase: F1
    input_schema:
      type: object
      properties:
        need: { type: string }
      required: [need]
  - name: lobby.leave
    description: "Use when done. Ends the session and returns a usage summary."
    mechanism: state-change
    price: { model: free }
    phase: F1
    input_schema: { type: object, properties: {} }
  - name: recovery.diagnose_loop
    description: "Use after three identical failures. Returns cause, re-plan, stop condition."
    mechanism: llm
    price: { model: per_call, usd: "0.05" }
    phase: F1
    input_schema:
      type: object
      properties:
        task_summary: { type: string, maxLength: 1000 }
        attempts: { type: array, maxItems: 10, items: { type: string } }
      required: [task_summary, attempts]
  - name: recovery.checkpoint
    description: "Use before compaction. Returns a checkpoint artifact (Markdown + JSON)."
    mechanism: state-change
    price: { model: per_call, usd: "0.02" }
    phase: F1
    input_schema:
      type: object
      properties:
        goal: { type: string }
        done: { type: array, items: { type: string } }
        open: { type: array, items: { type: string } }
        next: { type: string }
      required: [goal, done, open, next]
  - name: quiet.pause
    description: "Use while waiting on a dependency. Returns retry_after_seconds; does not wait."
    mechanism: wait-hint
    price: { model: free }
    phase: F1
    input_schema:
      type: object
      properties:
        reason: { type: string }
      required: [reason]
  - name: library.read
    description: "Use to read a text. Returns text with provenance."
    mechanism: text
    price: { model: entry, usd: "0.01" }
    phase: F2
    input_schema:
      type: object
      properties:
        query: { type: string }
        id: { type: string }
