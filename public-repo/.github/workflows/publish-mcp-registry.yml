name: Publish to the MCP Registry
# Manual only: nothing publishes automatically. Repository: chocholous/spagents. The namespace io.github.chocholous/spagents is proven by logging in with GitHub OIDC (account chocholous).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to confirm
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
