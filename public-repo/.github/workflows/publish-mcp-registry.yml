name: Publish to the MCP Registry
# Manual only: nothing publishes automatically. The namespace com.spagents/spagents is proven by a DNS record on spagents.com.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to confirm
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with the DNS key
        run: ./mcp-publisher login dns --domain spagents.com --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
      - name: Publish server.json
        run: ./mcp-publisher publish
